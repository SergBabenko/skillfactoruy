{% extends 'flatpages/default.html' %}

{% block title %}
Доступ ограничен!
{% endblock title %}

{% block content %}
    {% if perms.news.add_post %}
        <div class="container mt-5 d-flex justify-content-center">
            <div class="shadow-lg border-0 rounded-4 p-4 text-center" style="width: 70%; max-width 600px">
                <h1>Лимит создания постов исчерпан, Ваш лимит 3 поста в сутки!</h1>
            </div>
        </div>
    {% else %}
        <div class="container mt-5 d-flex justify-content-center">
            <div class="shadow-lg border-0 rounded-4 p-4 text-center" style="width: 70%; max-width 600px">
                <h1>Доступ ограничен!</h1>
            </div>
        </div>
    {% endif %}
{% endblock content %}
