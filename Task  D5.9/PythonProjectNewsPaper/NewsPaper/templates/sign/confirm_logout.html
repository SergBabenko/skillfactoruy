{% extends 'flatpages/default.html' %}


{% block title %}
Подтверждение выхода
{% endblock title %}

{% block content %}
<div style="text-align: center;">
    <h1>Вы уверены, что хотите выйти из системы?</h1>
    <form action="{% url 'logout' %}" method="post" class="filter-form">
        {% csrf_token %}
        <input type="submit" value="Подтвердить" class="btn btn-primary btn-sm">
    </form>
</div>
{% endblock content %}
