{% extends 'flatpages/default.html' %}
{% load custom_tags %}

{% block title %}
{{ add_or_change }}
{% endblock title %}

{% block content %}
<div style="text-align: center;">
    <h1>{{ add_or_change }}</h1>
    <h3>Date: {% current_time '%b %d %Y' %}</h3>
    <form action="" method="post" class="filter-form">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Создать" class="btn btn-primary btn-sm">
    </form>
</div>
{% endblock content %}
